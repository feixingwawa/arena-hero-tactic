[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-hero-tactic"
version = "0.1.0"
description = "Arena Hero「均衡扩张 + 防守」长期运行战术框架"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kou" }]
dependencies = [
    "arena-hero>=0.2.9,<0.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
arena-hero-tactic = "bot.main:main"

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
